name: Frontend CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000

      - name: Build Docker image
        run: docker build -t zuriapp-frontend:${{ github.sha }} --build-arg VITE_API_URL=http://localhost:5000 .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: zuriapp-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          skip-dirs: /usr/local/lib/node_modules/npm,/usr/local/lib/node_modules/corepack,/opt/yarn-v1.22.22

      - name: Push image to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag zuriapp-frontend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/zuriapp-frontend:${{ github.sha }}
          docker tag zuriapp-frontend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/zuriapp-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/zuriapp-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/zuriapp-frontend:latest
